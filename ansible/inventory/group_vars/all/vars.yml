---
# Lab network created on the remote libvirt host
lab_network:
  name: k8s
  bridge: virbr-k8s
  gateway: 10.100.0.1
  netmask: 255.255.255.0
  dhcp_start: 10.100.0.100
  dhcp_end: 10.100.0.200

# Lab VMs: static DHCP reservations on the lab network, plus sizing
lab_vms:
  - name: server
    mac: "52:54:00:00:00:10"
    ip: 10.100.0.10
    vcpus: 1
    memory_mb: 2048
    disk_gb: 20
  - name: node-0
    mac: "52:54:00:00:00:20"
    ip: 10.100.0.20
    vcpus: 2
    memory_mb: 2048
    disk_gb: 20
  - name: node-1
    mac: "52:54:00:00:00:21"
    ip: 10.100.0.21
    vcpus: 2
    memory_mb: 2048
    disk_gb: 20

# VM image and provisioning (all paths below are on the remote host
# unless noted)
lab_image_url: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2
lab_image_dir: /var/lib/libvirt/images
lab_os_variant: debian12
# Public key, read on the CONTROL machine, authorised for root and the default user
lab_ssh_public_key_file: ~/.ssh/id_ed25519.pub
