---
# Lab network created on the remote libvirt host
lab_network:
  name: k8s
  bridge: virbr-k8s
  gateway: 10.100.0.1
  netmask: 255.255.255.0
  dhcp_start: 10.100.0.100
  dhcp_end: 10.100.0.200

# Lab VMs: static DHCP reservations on the lab network
lab_vms:
  - name: server
    mac: "52:54:00:00:00:10"
    ip: 10.100.0.10
  - name: node-0
    mac: "52:54:00:00:00:20"
    ip: 10.100.0.20
  - name: node-1
    mac: "52:54:00:00:00:21"
    ip: 10.100.0.21
