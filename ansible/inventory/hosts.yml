---
all:
  children:
    libvirt_hosts:
      hosts:
        labhost:
          # IP lives in the vault: inventory/group_vars/all/vault.yml
          ansible_host: "{{ vault_lab_host_ip }}"
    # The VMs created by vms.yml, reached over SSH through labhost.
    # Connection settings: inventory/group_vars/lab_machines/vars.yml
    # Names must match lab_vms in inventory/group_vars/all/vars.yml.
    lab_machines:
      children:
        lab_servers:
          hosts:
            server:
        lab_nodes:
          hosts:
            node-0:
            node-1:
