---
# Removes the lab VMs created by vms.yml: stops and undefines each VM and
# deletes its disk and cloud-init user-data. The downloaded base image is kept.
- name: Remove lab VMs
  hosts: libvirt_hosts
  become: true
  environment:
    LIBVIRT_DEFAULT_URI: qemu:///system
  vars:
    lab_cloud_init_dir: "{{ lab_image_dir }}/cloud-init"
  tasks:
    # Any virsh error (e.g. no libvirt socket) fails here
    - name: List defined VMs
      ansible.builtin.command: virsh list --all --name
      register: vm_names
      changed_when: false

    - name: Check state of existing VMs
      ansible.builtin.command: virsh domstate {{ vm.name }}
      register: vm_state
      changed_when: false
      loop: "{{ lab_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"
      when: vm.name in vm_names.stdout_lines

    - name: Stop running VMs
      ansible.builtin.command: virsh destroy {{ result.vm.name }}
      loop: "{{ vm_state.results }}"
      loop_control:
        loop_var: result
        label: "{{ result.vm.name }}"
      when: result is not skipped and result.stdout is search('running|paused')
      changed_when: true

    - name: Undefine VMs and delete their disks
      ansible.builtin.command: virsh undefine {{ result.vm.name }} --remove-all-storage --nvram
      loop: "{{ vm_state.results }}"
      loop_control:
        loop_var: result
        label: "{{ result.vm.name }}"
      when: result is not skipped
      changed_when: true

    - name: Remove cloud-init user-data
      ansible.builtin.file:
        path: "{{ lab_cloud_init_dir }}/{{ vm.name }}-user-data"
        state: absent
      loop: "{{ lab_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"
