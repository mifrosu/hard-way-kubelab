---
# Creates the lab VMs with virt-install. Requires the lab network (site.yml),
# plus virt-install and xorriso on the remote host.
#
# cloud-init config is delivered as a NoCloud seed ISO (volume label "cidata")
# built here, rather than with virt-install --cloud-init, which delivered an
# empty user-data to the guest. The ISO is attached as a read-only virtio disk,
# not a CD-ROM: on a SATA CD-ROM the device can appear after cloud-init's
# ds-identify has run, which leaves cloud-init disabled for the boot.
#
# The seed disk stays attached to each VM, so a VM cannot start while its
# seed ISO is missing. Running this playbook rebuilds missing ISOs before it
# starts any VM.
- name: Create lab VMs
  hosts: libvirt_hosts
  become: true
  environment:
    LIBVIRT_DEFAULT_URI: qemu:///system
  vars:
    lab_base_image: "{{ lab_image_dir }}/{{ lab_image_url | basename }}"
    lab_cloud_init_dir: "{{ lab_image_dir }}/cloud-init"
  tasks:
    - name: Check that virt-install is available
      ansible.builtin.command: virt-install --version
      changed_when: false

    - name: Check that xorriso is available
      ansible.builtin.command: xorriso -version
      changed_when: false

    - name: Create cloud-init directory
      ansible.builtin.file:
        path: "{{ lab_cloud_init_dir }}"
        state: directory
        mode: "0755"

    # Never replaced once present: VM disks are overlays on this file
    - name: Download base image
      ansible.builtin.get_url:
        url: "{{ lab_image_url }}"
        dest: "{{ lab_base_image }}"
        mode: "0644"
        force: false

    - name: Render cloud-init user-data
      ansible.builtin.template:
        src: user-data.j2
        dest: "{{ lab_cloud_init_dir }}/{{ vm.name }}-user-data"
        mode: "0644"
      loop: "{{ lab_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"

    - name: Render cloud-init meta-data
      ansible.builtin.template:
        src: meta-data.j2
        dest: "{{ lab_cloud_init_dir }}/{{ vm.name }}-meta-data"
        mode: "0644"
      loop: "{{ lab_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"

    # Rebuilt whenever the ISO is missing or older than its user-data or
    # meta-data, so config changes reach VMs created later. The ISO is written
    # to a temporary file and renamed into place, so an interrupted build
    # never leaves a partial ISO at the final path. Rebuilding does not
    # reconfigure existing VMs: cloud-init only runs once per instance-id.
    - name: Build cloud-init seed ISOs
      ansible.builtin.shell: |
        set -eu
        iso={{ (lab_cloud_init_dir ~ '/' ~ vm.name ~ '-seed.iso') | quote }}
        ud={{ (lab_cloud_init_dir ~ '/' ~ vm.name ~ '-user-data') | quote }}
        md={{ (lab_cloud_init_dir ~ '/' ~ vm.name ~ '-meta-data') | quote }}
        if [ "$iso" -nt "$ud" ] && [ "$iso" -nt "$md" ]; then
          echo up-to-date
          exit 0
        fi
        rm -f "$iso.tmp"
        xorriso -as mkisofs -output "$iso.tmp" -volid cidata -joliet -rock \
          -graft-points "user-data=$ud" "meta-data=$md"
        mv -f "$iso.tmp" "$iso"
      register: seed_iso
      changed_when: seed_iso.stdout != 'up-to-date'
      loop: "{{ lab_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"

    # Any virsh error (e.g. no libvirt socket) fails here
    - name: List defined VMs
      ansible.builtin.command: virsh list --all --name
      register: vm_names
      changed_when: false

    - name: Check state of existing VMs
      ansible.builtin.command: virsh domstate {{ vm.name }}
      register: vm_state
      changed_when: false
      loop: "{{ lab_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"
      when: vm.name in vm_names.stdout_lines

    - name: Create missing VMs
      ansible.builtin.command:
        argv:
          - virt-install
          - --name={{ vm.name }}
          - --vcpus={{ vm.vcpus }}
          - --memory={{ vm.memory_mb }}
          - --os-variant={{ lab_os_variant }}
          - --import
          - --disk=path={{ lab_image_dir }}/{{ vm.name }}.qcow2,format=qcow2,size={{ vm.disk_gb }},backing_store={{ lab_base_image }}
          - --network=network={{ lab_network.name }},mac={{ vm.mac }}
          - --disk=path={{ lab_cloud_init_dir }}/{{ vm.name }}-seed.iso,format=raw,bus=virtio,readonly=on
          - --boot=hd
          - --graphics=none
          - --noautoconsole
      loop: "{{ lab_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"
      when: vm.name not in vm_names.stdout_lines
      changed_when: true

    - name: Start VMs that are shut off
      ansible.builtin.command: virsh start {{ result.vm.name }}
      loop: "{{ vm_state.results }}"
      loop_control:
        loop_var: result
        label: "{{ result.vm.name }}"
      when: result is not skipped and result.stdout is search('shut off')
      changed_when: true
